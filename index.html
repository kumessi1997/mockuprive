<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shama AI VoiceDome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 900px 500px at 50% 0%, #2a1445 0%, rgba(42, 20, 69, 0) 60%),
        linear-gradient(180deg, #0c0714 0%, #0a0710 45%, #08050d 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 72px 20px 90px;
    }

    .eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.22em;
      color: #ff4fa0;
      text-transform: uppercase;
      margin: 0 0 18px;
      text-align: center;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: clamp(24px, 4.2vw, 42px);
      line-height: 1.25;
      letter-spacing: 0.01em;
      color: #ffffff;
      text-transform: uppercase;
      text-align: center;
      max-width: 920px;
      margin: 0 0 26px;
    }

    h1 .accent {
      color: #b98bff;
    }

    .subtitle {
      font-size: clamp(14px, 1.5vw, 17px);
      line-height: 1.7;
      color: #a9a2bb;
      text-align: center;
      max-width: 620px;
      margin: 0 0 20px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 1060px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      background: transparent;
    }

    .stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 640px) {
      body {
        padding: 48px 16px 60px;
      }

      .subtitle {
        margin-bottom: 40px;
      }
    }
  </style>
</head>

<body>

  <p class="eyebrow">Welcome to Shama AI&reg; VoiceDome&reg;</p>

  <h1>Shama AI&reg; VoiceDome&reg; : A <span class="accent">Revolutionary</span> Solution to Scale in Real-Time</h1>

  <p class="subtitle">
    The first lightweight, real-time, advanced AI-powered defense to instantly
    differentiate authentic human speech from Voice Deepfakes and Replay Attacks
    during streaming.
  </p>

  <div class="stage" id="stage">
    <canvas id="riveCanvas"></canvas>
  </div>

  <script src="https://unpkg.com/@rive-app/webgl2/rive.js"></script>
  <script>
    const canvas = document.getElementById('riveCanvas');
    const stage = document.getElementById('stage');

    const r = new rive.Rive({
      src: 'shama.riv',
      canvas: canvas,
      artboard: 'Main',
      stateMachines: 'State Machine 1',
      autoplay: true,
      layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
      onLoad: () => {
        const b = r.bounds;
        const w = b.maxX - b.minX;
        const h = b.maxY - b.minY;
        if (w > 0 && h > 0) {
          stage.style.aspectRatio = `${w} / ${h}`;
        }
        r.resizeDrawingSurfaceToCanvas();
      },
      onLoadError: (e) => {
        console.error('Could not load shama.riv', e);
      }
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => r.resizeDrawingSurfaceToCanvas(), 100);
    });
  </script>

</body>

</html>
